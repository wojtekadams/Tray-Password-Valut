name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_WINRES_VERSION: v0.3.3

jobs:
  # Checks that a real KeePass client can open the files this app writes.
  keepassxc-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y keepassxc
      - run: go test -v -run TestKeePassXC ./internal/vault/

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Generate Windows resources (icon, manifest)
        run: |
          go install github.com/tc-hib/go-winres@${{ env.GO_WINRES_VERSION }}
          go-winres make --arch amd64

      # After the resources: the window test needs the manifest.
      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-H=windowsgui -s -w" -o TrayPasswordVault.exe .

      - name: Smoke test (the app must start and stay running)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\TrayPasswordVault.exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "App exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          $p.WaitForExit()

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path TrayPasswordVault.exe, LICENSE -DestinationPath TrayPasswordVault.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TrayPasswordVault
          path: |
            TrayPasswordVault.exe
            TrayPasswordVault.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, keepassxc-interop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TrayPasswordVault
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" TrayPasswordVault.exe TrayPasswordVault.zip --repo "$GITHUB_REPOSITORY" --generate-notes
