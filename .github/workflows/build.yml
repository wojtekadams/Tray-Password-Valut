name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_WINRES_VERSION: v0.3.3

jobs:
  # Checks that a real KeePass client can open the files this app writes.
  keepassxc-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y keepassxc
      - run: go test -v -run TestKeePassXC ./internal/vault/

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate Windows resources (icon, manifest)
        run: |
          go install github.com/tc-hib/go-winres@${{ env.GO_WINRES_VERSION }}
          go-winres make --arch amd64 --out cmd/traypasswordvault/rsrc

      # After the resources: the window test needs the manifest.
      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        # A release tag (v1.2.3) becomes the version shown in About.
        run: go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=${{ github.ref_type == 'tag' && github.ref_name || '' }}" -o TrayPasswordVault.exe ./cmd/traypasswordvault

      - name: Smoke test (the app must start and stay running)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\TrayPasswordVault.exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "App exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          $p.WaitForExit()

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path TrayPasswordVault.exe, LICENSE -DestinationPath TrayPasswordVault.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrayPasswordVault
          path: TrayPasswordVault.zip
          if-no-files-found: error

  # Scans what users actually download. The stable image bundles current signatures,
  # so it is deliberately not pinned to a digest.
  antivirus:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TrayPasswordVault
      - run: unzip TrayPasswordVault.zip -d unpacked
      - name: Scan with ClamAV
        run: docker run --rm --mount "type=bind,source=$PWD,target=/scan,readonly" clamav/clamav:stable clamscan --recursive --infected /scan

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, keepassxc-interop, antivirus]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TrayPasswordVault
      - env:
          GH_TOKEN: ${{ github.token }}
        # Re-runs (or a release drafted by hand) must not fail: replace the asset instead.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" TrayPasswordVault.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" TrayPasswordVault.zip --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
